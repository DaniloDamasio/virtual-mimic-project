spring.application.name=Virtual Mimic

# Server
server.port=8080

# H2 (in-memory)
spring.datasource.url=jdbc:h2:mem:virtual_mimic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 Console — http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=VirtualMimicSecretKeyForJWTTokenGeneration2026MustBeAtLeast256Bits
jwt.expiration-ms=86400000
