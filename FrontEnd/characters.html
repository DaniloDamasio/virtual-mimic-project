<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Mimic — Meus Personagens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica+SC&family=Jacques+Francois&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-sm">
        <span class="brand-icon" aria-hidden="true">⚔</span>
        <span class="brand-title-sm">Virtual Mimic</span>
      </div>
      <div class="user-info">
        <span class="user-greeting" id="user-greeting">Olá, Aventureiro</span>
        <button class="btn-logout" id="logout-btn" type="button">Sair</button>
      </div>
    </div>
  </header>

  <main class="app-main" role="main">
    <div class="page-header">
      <h2 class="page-title">Meus Personagens</h2>
      <button class="btn-primary" id="new-character-btn" type="button">
        + Novo Personagem
      </button>
    </div>

    <section class="characters-grid" id="characters-grid" aria-label="Lista de personagens">

      <div class="empty-state" id="empty-state">
        <svg class="empty-shield" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M48 8L12 22V48C12 66 28 80 48 88C68 80 84 66 84 48V22L48 8Z"
                fill="rgba(191,140,70,0.18)" stroke="rgba(191,140,70,0.50)" stroke-width="2"/>
          <path d="M48 22L28 30V48C28 58 36 66 48 72C60 66 68 58 68 48V30L48 22Z"
                fill="rgba(191,140,70,0.10)" stroke="rgba(191,140,70,0.35)" stroke-width="1.5"/>
          <line x1="36" y1="36" x2="60" y2="60" stroke="rgba(255,196,114,0.55)" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="60" y1="36" x2="36" y2="60" stroke="rgba(255,196,114,0.55)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>

        <h3 class="empty-title">
          Nenhum personagem encontrado.<br>Vamos começar sua primeira aventura!
        </h3>
        <button class="btn-primary" id="new-character-btn-empty" type="button">
          Criar Personagem
        </button>
      </div>

    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/characters.js"></script>
</body>
</html>
